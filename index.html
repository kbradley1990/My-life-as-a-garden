<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Garden of Becoming</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142218;color:#352b20;font-family:Georgia,serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #ffe8a6;outline-offset:3px}
.page{max-width:1536px;margin:auto}.world{position:relative;aspect-ratio:3/2;background:url('garden-scene.webp') center/100% 100% no-repeat;overflow:hidden;isolation:isolate}.shade{position:absolute;inset:0;background:#07120b85;pointer-events:none;transition:background 1.6s;z-index:1}.bed{position:absolute;z-index:4;border:0;background:transparent;transform:translate(-50%,-50%);width:28%;height:19%;border-radius:45%;color:transparent}.bed:hover{outline:3px solid #f6d48a;outline-offset:-12px}.soil,.bloom{position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:2}.soil{width:28%;height:19%;opacity:1}.bloom{width:28%;height:19%;opacity:0;transition:opacity 1.3s,filter 1.2s;mask-image:radial-gradient(ellipse at center,#000 32%,transparent 75%)}.bloom.stage1{opacity:.9;clip-path:ellipse(9% 15% at 50% 70%);filter:saturate(.65)}.bloom.stage2{opacity:.95;clip-path:ellipse(20% 35% at 50% 65%);filter:saturate(.8)}.bloom.stage3{opacity:1}.bedlabel{position:absolute;z-index:5;transform:translate(-50%,-50%);border:1px solid #9d7748;background:linear-gradient(#fff5dc,#e3c898);border-radius:30px;padding:5px 10px;box-shadow:0 3px 10px #0009;min-width:12%;text-align:center;pointer-events:none;font-size:clamp(9px,1.4vw,19px)}.bedlabel small{display:block;font-size:.66em}.headline{position:absolute;z-index:5;left:29%;top:3%;width:43%;text-align:center;pointer-events:none;color:#3c291c}.headline h1{font-weight:normal;font-style:italic;font-size:clamp(17px,3.3vw,52px);margin:0}.headline p{font-size:clamp(7px,.85vw,14px);margin:2px}.welcome{position:absolute;z-index:5;top:42%;left:38%;width:24%;text-align:center;background:#f6e6c9ed;border:2px solid #a17b4a;border-radius:20px;padding:1.5%;box-shadow:0 8px 25px #0008}.welcome h2{font-size:clamp(12px,2.3vw,31px);font-weight:normal;font-style:italic;margin:0 0 8px}.welcome p{font-size:clamp(9px,1vw,15px);line-height:1.4}.welcome button{border:0;border-radius:22px;background:#284a2a;color:#fff4d9;padding:8px 13px;font-size:clamp(9px,1vw,15px)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:12px;background:#1a3021}.toolbar button{border:1px solid #c9a86e;border-radius:20px;background:#f7e7c8;padding:9px 15px;color:#3e3527}.progress{text-align:center;background:#ead6af;padding:12px;font-size:15px}.progress progress{width:min(500px,90%);display:block;margin:8px auto;accent-color:#3e6a43}.spark{position:absolute;z-index:3;pointer-events:none;width:5px;height:5px;border-radius:50%;background:#fff4b8;box-shadow:0 0 13px 5px #ffe8a1;animation:drift 5s infinite alternate}@keyframes drift{to{transform:translate(22px,-34px);opacity:.25}}.dialogbg{position:fixed;inset:0;background:#0b180fcf;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}.dialogbg.open{display:flex}.dialog{background:linear-gradient(135deg,#fff3d9,#e6cf9e);border:6px double #9b7e4d;border-radius:18px;padding:25px;max-width:580px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 15px 65px #000a}.dialog h2{font-weight:normal;font-style:italic;margin:0 0 12px;font-size:30px}.dialog p{line-height:1.6}.dialog textarea{width:100%;min-height:145px;padding:13px;border:1px solid #a98d5e;border-radius:8px;background:#fffbf3;font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{background:#2e5137;color:#fff1d2;border:0;border-radius:9px;padding:11px 15px}.actions button.secondary{background:#d8c59e;color:#312e24}.note{font-size:12px}.toast{position:fixed;z-index:30;top:12%;left:50%;transform:translateX(-50%);background:#193a27;color:#fff1c8;border:1px solid #edcb7e;padding:14px 20px;border-radius:13px;display:none;text-align:center;max-width:90vw}
@media(max-width:650px){.world{width:900px;max-width:none}.page{overflow-x:auto}.bedlabel{font-size:12px}.headline h1{font-size:30px}.headline p{font-size:10px}.welcome h2{font-size:19px}.welcome p{font-size:11px}.welcome button{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<style>
/* The illustration already includes the heading, welcome card, category names and footer.
   These are deliberately not rendered twice. */
.begin-hotspot{position:absolute;z-index:9;left:39.5%;top:66%;width:21%;height:8%;border:2px solid #d8b76b;background:linear-gradient(#396e25,#143d19);color:#fff4d4;text-shadow:0 1px 2px #152d12;border-radius:30px;cursor:pointer;font-size:clamp(10px,1.65vw,24px);box-shadow:0 4px 12px #0007}
.begin-hotspot:hover{filter:brightness(1.2)}
.bedlabel{background:#f5e4c8;border:0;border-radius:3px;box-shadow:none;min-width:0;width:10%;padding:0;line-height:1;transform:translate(-50%,-50%);font-size:clamp(9px,1.1vw,15px)}
.bedlabel small{font-size:1em;white-space:nowrap}
.bed{z-index:8}
.progress{position:relative;background:linear-gradient(110deg,#f4e4c2,#ead2a4);border-top:3px solid #ad8751}
@media(max-width:650px){.begin-hotspot{left:39.5%;top:66%;width:21%;height:8%}.bedlabel{font-size:11px}}
</style>
</head><body><div class="page"><div class="world" id="world"><div class="shade" id="shade"></div><button id="begin" class="begin-hotspot">Begin Your Journey ❯❯</button><div id="plants"></div><div id="lights"></div></div><div class="progress" aria-live="polite"><strong id="status">0 of 6 beds awakened · 0 of 18 reflections</strong><progress id="progress" max="18" value="0"></progress></div><div class="toolbar"><button id="journal">My Journal</button><button id="export">Export Reflections</button><button id="reset">Start Over</button></div></div><div class="dialogbg" id="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><h2 id="title"></h2><div id="body"></div><div class="actions" id="actions"></div></div></div><div class="toast" id="toast" role="status"></div><script>
const themes=[
{name:'Self-Worth',x:365,y:565,flower:'rose',journeys:[
[['The Forgotten Compliment','Recall a compliment you brushed aside. What exactly did someone notice, and why was it difficult to accept?'],['Borrowed Eyes','Imagine seeing yourself through the eyes of someone who cares for you. Which quality might they notice that you often overlook?'],['A Different Reflection','Remember a recent mistake. Write the compassionate response you would give a friend who made the same mistake.']],
[['The Quiet Achievement','Name something you accomplished that nobody applauded. What did it take from you?'],['Your Own Witness','If you could give that effort a small ceremony, what would you say to honor it?'],['A Place on the Mantel','What does this accomplishment prove about you, even if nobody else ever notices it?']],
[['The Borrowed Label','What label have others given you that never quite fit? Where did it come from?'],['Peeling It Away','Describe a moment when your actions contradicted that label.'],['Your True Name','Choose three words that describe who you are beyond that label. What evidence supports each one?']],
[['The Inner Critic’s Script','Write one exact sentence your inner critic repeats when you struggle.'],['The Gentle Editor','Which words in that sentence are unfair or exaggerated? Rewrite it with accuracy and kindness.'],['A New Refrain','What shorter, believable sentence could you practice saying instead next time?']],
[['The Unseen Strength','Think of a hard season you survived. What strength helped you through that you rarely acknowledge?'],['Giving It Room','Where could you use that same strength in one small way this week?'],['The Rose You Keep','What would you like to remember about yourself when the next difficult season comes?']]]},
{name:'Relationships',x:670,y:570,flower:'rose',journeys:[
[['The Unspoken Sentence','Think of a relationship where you have held something back. What single sentence have you wished you could say?'],['The Garden Gate','What boundary could protect your energy while still allowing healthy connection?'],['A Small Bridge','What specific, low-pressure gesture could help you move toward the connection you want?']],
[['The Energy Weather','Think of a recent interaction that left you feeling lighter or heavier. What happened?'],['Reading the Forecast','What clues in your body or mood tell you a relationship feels nourishing or draining?'],['Choosing Shelter','What is one change you could make to care for yourself before or after a draining interaction?']],
[['The Missed Translation','Recall a conversation where you felt misunderstood. What did you want the other person to understand?'],['A Clearer Message','Try rewriting your message beginning with “I felt… when… because…” without assuming their intentions.'],['The Open Door','What question could you ask to better understand their perspective, if it feels safe to do so?']],
[['A Seat at the Table','When do you find yourself saying yes while wishing you could say no? Describe one example.'],['Practice the Pause','Write a respectful one-sentence response that buys you time before agreeing.'],['Room for Yourself','How might honoring that pause change the way you feel in this relationship?']],
[['The Connection You Miss','Remember a moment you felt genuinely understood. What did the other person do?'],['Recreating the Moment','Which small part of that experience could you invite into a current relationship?'],['A Living Invitation','Write a simple invitation or request for connection you could make, if you choose.']]]},
{name:'Inner Peace',x:1010,y:570,flower:'lavender',journeys:[
[['The Invisible Backpack','If your worries were objects in a backpack, which one would be heaviest today?'],['The Volume Dial','What thought keeps replaying? What could turn its volume down just one notch?'],['Your Quiet Corner','Name three details that would make a personal sanctuary soothing. How could you bring one into today?']],
[['The Unfinished Loop','What small unfinished task keeps tugging at your attention?'],['A Two-Minute Beginning','What is the smallest visible first step, even if you cannot finish the whole task?'],['Permission to Rest','What could you tell yourself after taking that step so you can stop carrying it for tonight?']],
[['The Storm Report','Describe a recent stressful moment as weather: wind, rain, thunder, or fog. What did it feel like?'],['Finding the Ground','Where in your body did you notice the storm? What helped you feel a little steadier?'],['After the Rain','What would a realistic, gentler response look like if a similar storm returns?']],
[['The Control Basket','List one thing you are trying to control that depends partly on someone else.'],['Sorting the Seeds','Separate what you can influence from what you cannot decide for them.'],['Open Hands','What small action belongs to you, and what might you practice releasing?']],
[['The Sensory Map','Recall a place where you have felt calm. What sound, texture, scent, or light do you remember?'],['One Small Anchor','Choose one sensory detail you can recreate safely in your current space. How?'],['The Return Path','Write a simple three-step grounding ritual you could use on a difficult day.']]]},
{name:'Courage',x:425,y:710,flower:'sunflower',journeys:[
[['The Almost Moment','Recall something you almost tried or said, but stopped. What were you afraid might happen?'],['One Brave Inch','If you took only the smallest possible step toward it, what would you actually do?'],['Evidence of Bravery','Remember a time you acted while afraid. What does that tell you about your capacity now?']],
[['The Door with No Sign','What opportunity feels unfamiliar enough that you hesitate to approach it?'],['Looking Through the Keyhole','What information or support would make that first step feel more manageable?'],['Touching the Handle','Name a reversible, low-risk action you could take to explore the opportunity.']],
[['The Voice You Swallowed','Recall a moment you wanted to speak up but stayed silent. What mattered to you?'],['Rehearsal in the Garden','Write the exact respectful words you wish you had used.'],['A Steadier Voice','Where could you practice one sentence of self-advocacy in a safer, smaller situation?']],
[['The Map of Mistakes','Think of a mistake that still makes you hesitate. What did you learn from it?'],['Changing the Legend','What part of the story was learning rather than failure?'],['A New Route','What safeguard or adjustment would help you try something similar again?']],
[['The Helpful Companion','Imagine bringing one supportive person or resource along for a difficult step. Who or what would it be?'],['Asking for a Hand','What specific kind of support would make the next step easier?'],['Walking Forward','Write one clear request for that support, or a plan to find it.']]]},
{name:'Joy',x:755,y:710,flower:'daisy',journeys:[
[['The Time Machine','What activity once made you lose track of time? Describe one vivid memory of doing it.'],['The Five-Minute Escape','If you had five guilt-free minutes today, how would you use them?'],['Collecting Sunlight','Recall three small pleasant moments this week. What do they have in common?']],
[['A Tiny Museum','If you made a museum of ordinary things that delight you, what would be its first exhibit?'],['A Closer Look','What details make that ordinary thing interesting or beautiful?'],['The Pocket Collection','What is one little delight you could intentionally notice or collect this week?']],
[['The Soundtrack of a Day','What song or sound takes you back to a happier or more playful moment?'],['Turning Up the Music','What did that version of you enjoy that you rarely make time for now?'],['A New Verse','How could you bring a tiny piece of that playfulness into tomorrow?']],
[['The Curiosity Trail','What harmless subject or skill have you been oddly curious about lately?'],['Following a Thread','What question would you love to explore about it, just for fun?'],['A Date with Wonder','Plan a ten-minute curiosity adventure with no productivity goal. What will you do?']],
[['A Kind Surprise','Recall an unexpected small kindness that brightened a day. What made it memorable?'],['Passing the Spark','What tiny kindness could you offer yourself or another person without expecting anything back?'],['The Warm Afterglow','Imagine doing it. What feeling or connection would you hope to carry forward?']]]},
{name:'New Beginnings',x:1100,y:715,flower:'lavender',journeys:[
[['The Old Suitcase','Imagine packing for your next chapter. What belief about yourself would you leave behind?'],['A Letter from Tomorrow','Imagine yourself six months from now after making one change. What would future-you thank you for starting?'],['The First Page','Give your next chapter a title. Describe one small scene you would like in its opening pages.']],
[['The Empty Shelf','What commitment or expectation no longer fits the life you want to build?'],['Making Space','If you set it down, what could that time or energy make room for?'],['The First Keepsake','What new habit or experience would you place on that newly open shelf?']],
[['The Seed Catalog','List three possibilities you have quietly wondered about, even if they seem unrealistic.'],['Choosing One Seed','Which possibility feels most interesting, not necessarily most impressive? Why?'],['The Trial Plot','Design a small experiment to explore it without making a huge commitment.']],
[['A Postcard from the Future','Picture an ordinary morning in a life that fits you better. What do you see first?'],['Tracing the Path','Which part of that morning could you begin creating with the resources you have?'],['Tomorrow’s Detail','Choose one specific action that would make tomorrow resemble that picture a little more.']],
[['The Changing Seasons','What part of your life feels like it is ending, shifting, or beginning?'],['What Comes Along','What lesson or value from the previous season do you want to carry forward?'],['A Gentle Welcome','Write a short welcome note to the person you are becoming, without demanding perfection.']]]}
];
const labels=['Self-Worth','Inner Peace','Relationships','Courage','Joy','New Beginnings'];
const flowerNames=['Rose','Lavender','Jasmine','Marigold','Wildflower','Forget-Me-Not'];
const rewards=['The rose arch begins to shimmer.','The fountain sparkles in the sunlight.','The wishing arbor awakens.','Golden light spreads across the pathway.','Butterflies visit the garden.','The greenhouse glows with new life.'];
const spots=[[22.5,34],[77.5,34],[18,51],[82,51],[18,68],[82,68]];
const labelspots=[[22,40],[78,40],[20,63],[78,63],[20,84],[78,84]];
const themeIndex=[0,3,1,4,2,5],key='garden-of-becoming-six-v1';
let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}
if(!data||!Array.isArray(data.beds)||data.beds.length!==6)data={beds:Array.from({length:6},()=>({stage:0,answers:['','','']})),history:[]};
const $=id=>document.getElementById(id),steps=()=>data.beds.reduce((a,b)=>a+b.stage,0),done=()=>data.beds.filter(b=>b.stage===3).length;
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){toast('Saving is blocked. Export reflections before leaving.')}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4200)}
function render(){const n=steps();$('status').textContent=done()+' of 6 beds awakened · '+n+' of 18 reflections';$('progress').value=n;$('shade').style.background=`rgba(7,18,11,${.17-.15*n/18})`;const root=$('plants');root.innerHTML='';spots.forEach(([x,y],i)=>{const stage=data.beds[i].stage;let soil=document.createElement('img');soil.className='soil';soil.src=`bed-${i}-soil.png`;soil.style.left=x+'%';soil.style.top=y+'%';soil.alt='';/* soil already painted naturally into the scene */if(stage){let bloom=document.createElement('img');bloom.className='bloom stage'+stage;bloom.src=`bed-${i}-bloom.webp`;bloom.style.left=x+'%';bloom.style.top=y+'%';bloom.alt='';root.appendChild(bloom)}let btn=document.createElement('button');btn.className='bed';btn.style.left=x+'%';btn.style.top=y+'%';btn.setAttribute('aria-label',labels[i]+', '+stage+' of 3 reflections');btn.onclick=()=>openBed(i);root.appendChild(btn);let label=document.createElement('div');label.className='bedlabel';label.style.left=labelspots[i][0]+'%';label.style.top=labelspots[i][1]+'%';label.innerHTML='<small>'+stage+' / 3 reflections '+(stage===3?'✦':'')+'</small>';/* The garden artwork already has category plaques. */});
$('lights').innerHTML='';for(let i=0;i<done()*7;i++){let f=document.createElement('i');f.className='spark';f.style.left=(12+(i*29%78))+'%';f.style.top=(20+(i*17%64))+'%';f.style.animationDelay=(-i*.5)+'s';$('lights').appendChild(f)}}
function close(){$('backdrop').classList.remove('open')}
function modal(title,body,buttons){$('title').textContent=title;$('body').innerHTML='';if(typeof body==='string'){$('body').textContent=body}else $('body').appendChild(body);$('actions').innerHTML='';buttons.forEach(({label,fn,secondary})=>{let b=document.createElement('button');b.textContent=label;b.className=secondary?'secondary':'';b.onclick=fn;$('actions').appendChild(b)});$('backdrop').classList.add('open')}
function openBed(i){let b=data.beds[i];if(b.stage===3){modal(labels[i]+' is blooming','Your '+flowerNames[i]+' has awakened its entire bed. '+rewards[i],[{label:'Return to garden',fn:close},{label:'My journal',secondary:true,fn:journal}]);return}
let s=b.stage,q=themes[themeIndex[i]].journeys[0][s];let wrap=document.createElement('div'),p=document.createElement('p');p.textContent=q[1];wrap.appendChild(p);let input=document.createElement('textarea');input.placeholder='Your reflection…';input.setAttribute('aria-label','Your reflection');input.value=b.answers[s]||'';wrap.appendChild(input);let note=document.createElement('p');note.className='note';note.textContent='There is no right answer. You can skip any prompt without penalty.';wrap.appendChild(note);
function finish(skip){let answer=skip?'':input.value.trim();if(!skip&&!answer){toast('Write a reflection or choose Skip.');return}b.answers[s]=answer;b.stage++;data.history.push({date:new Date().toISOString(),bed:labels[i],stage:s+1,title:q[0],prompt:q[1],answer});save();close();render();toast(s===0?'A little seedling begins to grow.':s===1?'Your plant grows leaves and a bud.':labels[i]+' awakens! '+rewards[i]);if(done()===6)toast('Your entire sanctuary is alive. Every bed is in bloom!')}
modal(q[0],wrap,[{label:['Plant my seed','Nurture my plant','Let it bloom'][s],fn:()=>finish(false)},{label:'Skip gently',secondary:true,fn:()=>finish(true)},{label:'Back',secondary:true,fn:close}])}
function journal(){let wrap=document.createElement('div');if(!data.history.length)wrap.textContent='Your reflections will appear here.';else data.history.slice().reverse().forEach(e=>{let p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=e.bed+' · '+e.title;p.appendChild(strong);p.appendChild(document.createElement('br'));p.appendChild(document.createTextNode(e.answer||'(Skipped)'));wrap.appendChild(p)});modal('Pages from your garden',wrap,[{label:'Close',fn:close}])}
$('journal').onclick=journal;$('begin').onclick=()=>openBed(data.beds.findIndex(b=>b.stage<3)===-1?0:data.beds.findIndex(b=>b.stage<3));$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('export').onclick=()=>{let t='THE GARDEN OF BECOMING\n\n'+data.history.map(e=>`${e.bed} — ${e.title}\n${e.prompt}\n${e.answer||'(Skipped)'}\n`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='my-garden-reflections.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('reset').onclick=()=>modal('Start your garden again?','This will erase saved reflections and progress in this browser. Export your journal first if you want a copy.',[{label:'Keep my garden',fn:close,secondary:true},{label:'Reset garden',fn:()=>{data={beds:Array.from({length:6},()=>({stage:0,answers:['','','']})),history:[]};save();close();render()}}]);render();
</script></body></html>
