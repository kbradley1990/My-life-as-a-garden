<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Garden of Becoming</title><style>
:root{--gold:#e8c993;--cream:#f8ebcf;--ink:#2e382e}*{box-sizing:border-box}body{margin:0;background:#101b17;color:var(--cream);font-family:Georgia,'Times New Roman',serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #f9d48a;outline-offset:3px}
header{position:absolute;z-index:20;top:16px;left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}.plaque{pointer-events:auto;background:#172c25e8;border:1px solid #c8a86e9c;border-radius:14px;padding:12px 17px;box-shadow:0 7px 30px #0008;backdrop-filter:blur(12px)}h1{font-size:clamp(19px,2.6vw,31px);font-weight:normal;margin:0;color:#f8dfaa}.subtitle{font-size:12px;opacity:.84;margin:5px 0 0}.count{font-size:13px;white-space:nowrap}.meter{height:6px;background:#64705b70;border-radius:12px;margin-top:9px;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#87a77e,#f6d88b);width:0;transition:width .7s}
main{position:relative;height:100svh;min-height:570px;overflow:hidden}.world{position:absolute;inset:0;overflow:hidden;background:#19241c}.landscape{position:absolute;inset:0;background-image:url('enchanted-garden.png');background-position:center;background-size:cover;transition:filter 1.5s,transform 1.3s;filter:saturate(.25) brightness(.47)}.living{position:absolute;inset:0;background-image:url('enchanted-garden.png');background-position:center;background-size:cover;opacity:0;transition:opacity 1.6s;mask-image:radial-gradient(ellipse at 50% 70%,black 0%,transparent 65%)}.mist{position:absolute;inset:0;background:linear-gradient(0deg,#08120d94,transparent 42%,#0c1a17a8);pointer-events:none;transition:opacity 1s}.world.finale .landscape{filter:saturate(1.15) brightness(1.06)}.world.finale .living{opacity:1!important;mask-image:none}.world.finale .mist{opacity:.16}
.garden-map{position:absolute;inset:0;transform-origin:center center;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(100px,15vw,205px);min-height:82px;border:1px solid #d5b37bba;border-radius:50%;color:#ffe7b8;background:radial-gradient(ellipse,#132a20e8 0%,#152d21ad 60%,#172b2055 100%);box-shadow:0 0 0 5px #b6a17624,0 10px 28px #0008;backdrop-filter:blur(2px);text-shadow:0 2px 4px #000;transition:background .6s,box-shadow .6s,transform .6s}.spot:hover{transform:translate(-50%,-50%) scale(1.07)}.spot.active{background:#2a4229e8;box-shadow:0 0 0 6px #f4d99c40,0 0 35px #ffe1a655}.spot.complete{border-color:#f9e3a5;box-shadow:0 0 30px #ffce72a6}.spot .emblem{display:block;font-size:23px;line-height:1.1}.spot .name{display:block;font-size:clamp(12px,1.3vw,16px)}.spot .small{display:block;font-size:11px;opacity:.85;margin-top:3px}.spot .vine{position:absolute;inset:-8px;pointer-events:none;border-radius:50%;border:2px dotted #d3b677;opacity:0}.spot.complete .vine{opacity:1;animation:halo 4s ease-in-out infinite alternate}@keyframes halo{to{filter:drop-shadow(0 0 11px #ffeaa4);transform:scale(1.07)}}
.fireflies{position:absolute;inset:0;pointer-events:none}.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffeab0;box-shadow:0 0 15px 5px #ffcf6e9c;animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(24px,-45px);opacity:.3}}
.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(96%,820px)}.control{background:#1c372bdc;color:#f8e6c2;border:1px solid #cbb27b;padding:11px 15px;border-radius:999px;backdrop-filter:blur(8px)}.control:hover{background:#35543c}.control:disabled{opacity:.45;cursor:default}.hint{position:absolute;z-index:10;bottom:84px;left:50%;transform:translateX(-50%);text-align:center;max-width:90%;font-size:13px;text-shadow:0 2px 6px #000;background:#162a20bd;border-radius:30px;padding:8px 15px}
.panel{position:absolute;z-index:12;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,560px);max-height:min(85svh,720px);overflow:auto;padding:25px;background:linear-gradient(135deg,#f9f0d7,#e9d6b1);color:#343e32;border:7px double #947d57;border-radius:16px;box-shadow:0 25px 100px #000b;display:none}.panel.open{display:block}.panel h2{font-weight:normal;font-size:clamp(25px,4vw,36px);margin:8px 0 12px}.panel p{line-height:1.6}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6b6749}.panel textarea{display:block;width:100%;min-height:140px;padding:14px;border:1px solid #aa936f;border-radius:9px;background:#fffaf0;color:#2c342d;resize:vertical;font-size:16px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.action{padding:11px 16px;border-radius:8px;background:#2e503a;color:#fff2d2;border:0}.action.secondary{background:#dfd0ae;color:#344133}.flower-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}.flower{padding:9px 3px;min-height:74px;border-radius:10px;border:1px solid #ac9266;background:#f5e8c9;color:#374534}.flower strong{display:block;font-size:21px}.flower span{font-size:10px}.flower.current{outline:3px solid #8d995d}.flower:disabled{opacity:.6;cursor:default}.note{font-size:12px;color:#6c654e}.toast{position:absolute;z-index:30;top:22%;left:50%;transform:translateX(-50%);background:#172d23f2;border:1px solid #e6cb8e;color:#f9e9c4;padding:16px 23px;border-radius:15px;box-shadow:0 12px 40px #0008;max-width:min(92vw,480px);text-align:center;display:none}.celebrate{position:absolute;z-index:8;inset:0;pointer-events:none;display:none;place-items:center;background:radial-gradient(circle,#ffe2a43b,transparent 70%)}.celebrate.show{display:grid;animation:celebration 4s ease forwards}.celebrate span{font-size:clamp(30px,5vw,70px);text-shadow:0 0 28px #fff4bd;animation:rise 3.5s ease both}@keyframes celebration{0%{opacity:0}25%{opacity:1}85%{opacity:1}100%{opacity:0}}@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}30%{opacity:1}to{transform:translateY(-25px) scale(1.12);opacity:0}}
@media(max-width:600px){header{top:8px;left:8px;right:8px}.plaque{padding:9px 11px}.subtitle{display:none}.count{font-size:11px}.spot{width:105px;min-height:66px}.spot .emblem{font-size:17px}.spot .name{font-size:11px}.spot .small{font-size:9px}.hint{bottom:114px}.controls{bottom:10px}.control{font-size:12px;padding:10px 12px}.flower-grid{gap:3px}.flower{padding:7px 1px}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="world" id="world"><div class="landscape"></div><div class="living" id="living"></div><div class="mist"></div><div class="garden-map" id="map"></div><div class="fireflies" id="fireflies"></div></div>
<header><div class="plaque"><h1>✧ The Garden of Becoming ✧</h1><p class="subtitle">A sanctuary that grows with your reflections</p></div><div class="plaque count"><div id="counter">0 / 30 flowers blooming</div><div class="meter"><div id="meter"></div></div></div></header>
<div class="hint" id="hint">Choose a garden bed to begin restoring your sanctuary.</div><div class="controls"><button class="control" id="home">⌂ Whole garden</button><button class="control" id="plant" disabled>✿ Tend this garden</button><button class="control" id="journal">☷ My journal</button><button class="control" id="export">↓ Export reflections</button></div>
<div class="celebrate" id="celebrate"><span id="celebrateText">✧ The garden awakens ✧</span></div><div class="toast" id="toast" role="status"></div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div class="eyebrow" id="eyebrow"></div><h2 id="panelTitle"></h2><div id="panelBody"></div><div class="actions" id="panelActions"></div></section></main>
<script>
const themes=[
{name:'Self-Worth',x:365,y:565,flower:'rose',journeys:[
[['The Forgotten Compliment','Recall a compliment you brushed aside. What exactly did someone notice, and why was it difficult to accept?'],['Borrowed Eyes','Imagine seeing yourself through the eyes of someone who cares for you. Which quality might they notice that you often overlook?'],['A Different Reflection','Remember a recent mistake. Write the compassionate response you would give a friend who made the same mistake.']],
[['The Quiet Achievement','Name something you accomplished that nobody applauded. What did it take from you?'],['Your Own Witness','If you could give that effort a small ceremony, what would you say to honor it?'],['A Place on the Mantel','What does this accomplishment prove about you, even if nobody else ever notices it?']],
[['The Borrowed Label','What label have others given you that never quite fit? Where did it come from?'],['Peeling It Away','Describe a moment when your actions contradicted that label.'],['Your True Name','Choose three words that describe who you are beyond that label. What evidence supports each one?']],
[['The Inner Critic’s Script','Write one exact sentence your inner critic repeats when you struggle.'],['The Gentle Editor','Which words in that sentence are unfair or exaggerated? Rewrite it with accuracy and kindness.'],['A New Refrain','What shorter, believable sentence could you practice saying instead next time?']],
[['The Unseen Strength','Think of a hard season you survived. What strength helped you through that you rarely acknowledge?'],['Giving It Room','Where could you use that same strength in one small way this week?'],['The Rose You Keep','What would you like to remember about yourself when the next difficult season comes?']]]},
{name:'Relationships',x:670,y:570,flower:'rose',journeys:[
[['The Unspoken Sentence','Think of a relationship where you have held something back. What single sentence have you wished you could say?'],['The Garden Gate','What boundary could protect your energy while still allowing healthy connection?'],['A Small Bridge','What specific, low-pressure gesture could help you move toward the connection you want?']],
[['The Energy Weather','Think of a recent interaction that left you feeling lighter or heavier. What happened?'],['Reading the Forecast','What clues in your body or mood tell you a relationship feels nourishing or draining?'],['Choosing Shelter','What is one change you could make to care for yourself before or after a draining interaction?']],
[['The Missed Translation','Recall a conversation where you felt misunderstood. What did you want the other person to understand?'],['A Clearer Message','Try rewriting your message beginning with “I felt… when… because…” without assuming their intentions.'],['The Open Door','What question could you ask to better understand their perspective, if it feels safe to do so?']],
[['A Seat at the Table','When do you find yourself saying yes while wishing you could say no? Describe one example.'],['Practice the Pause','Write a respectful one-sentence response that buys you time before agreeing.'],['Room for Yourself','How might honoring that pause change the way you feel in this relationship?']],
[['The Connection You Miss','Remember a moment you felt genuinely understood. What did the other person do?'],['Recreating the Moment','Which small part of that experience could you invite into a current relationship?'],['A Living Invitation','Write a simple invitation or request for connection you could make, if you choose.']]]},
{name:'Inner Peace',x:1010,y:570,flower:'lavender',journeys:[
[['The Invisible Backpack','If your worries were objects in a backpack, which one would be heaviest today?'],['The Volume Dial','What thought keeps replaying? What could turn its volume down just one notch?'],['Your Quiet Corner','Name three details that would make a personal sanctuary soothing. How could you bring one into today?']],
[['The Unfinished Loop','What small unfinished task keeps tugging at your attention?'],['A Two-Minute Beginning','What is the smallest visible first step, even if you cannot finish the whole task?'],['Permission to Rest','What could you tell yourself after taking that step so you can stop carrying it for tonight?']],
[['The Storm Report','Describe a recent stressful moment as weather: wind, rain, thunder, or fog. What did it feel like?'],['Finding the Ground','Where in your body did you notice the storm? What helped you feel a little steadier?'],['After the Rain','What would a realistic, gentler response look like if a similar storm returns?']],
[['The Control Basket','List one thing you are trying to control that depends partly on someone else.'],['Sorting the Seeds','Separate what you can influence from what you cannot decide for them.'],['Open Hands','What small action belongs to you, and what might you practice releasing?']],
[['The Sensory Map','Recall a place where you have felt calm. What sound, texture, scent, or light do you remember?'],['One Small Anchor','Choose one sensory detail you can recreate safely in your current space. How?'],['The Return Path','Write a simple three-step grounding ritual you could use on a difficult day.']]]},
{name:'Courage',x:425,y:710,flower:'sunflower',journeys:[
[['The Almost Moment','Recall something you almost tried or said, but stopped. What were you afraid might happen?'],['One Brave Inch','If you took only the smallest possible step toward it, what would you actually do?'],['Evidence of Bravery','Remember a time you acted while afraid. What does that tell you about your capacity now?']],
[['The Door with No Sign','What opportunity feels unfamiliar enough that you hesitate to approach it?'],['Looking Through the Keyhole','What information or support would make that first step feel more manageable?'],['Touching the Handle','Name a reversible, low-risk action you could take to explore the opportunity.']],
[['The Voice You Swallowed','Recall a moment you wanted to speak up but stayed silent. What mattered to you?'],['Rehearsal in the Garden','Write the exact respectful words you wish you had used.'],['A Steadier Voice','Where could you practice one sentence of self-advocacy in a safer, smaller situation?']],
[['The Map of Mistakes','Think of a mistake that still makes you hesitate. What did you learn from it?'],['Changing the Legend','What part of the story was learning rather than failure?'],['A New Route','What safeguard or adjustment would help you try something similar again?']],
[['The Helpful Companion','Imagine bringing one supportive person or resource along for a difficult step. Who or what would it be?'],['Asking for a Hand','What specific kind of support would make the next step easier?'],['Walking Forward','Write one clear request for that support, or a plan to find it.']]]},
{name:'Joy',x:755,y:710,flower:'daisy',journeys:[
[['The Time Machine','What activity once made you lose track of time? Describe one vivid memory of doing it.'],['The Five-Minute Escape','If you had five guilt-free minutes today, how would you use them?'],['Collecting Sunlight','Recall three small pleasant moments this week. What do they have in common?']],
[['A Tiny Museum','If you made a museum of ordinary things that delight you, what would be its first exhibit?'],['A Closer Look','What details make that ordinary thing interesting or beautiful?'],['The Pocket Collection','What is one little delight you could intentionally notice or collect this week?']],
[['The Soundtrack of a Day','What song or sound takes you back to a happier or more playful moment?'],['Turning Up the Music','What did that version of you enjoy that you rarely make time for now?'],['A New Verse','How could you bring a tiny piece of that playfulness into tomorrow?']],
[['The Curiosity Trail','What harmless subject or skill have you been oddly curious about lately?'],['Following a Thread','What question would you love to explore about it, just for fun?'],['A Date with Wonder','Plan a ten-minute curiosity adventure with no productivity goal. What will you do?']],
[['A Kind Surprise','Recall an unexpected small kindness that brightened a day. What made it memorable?'],['Passing the Spark','What tiny kindness could you offer yourself or another person without expecting anything back?'],['The Warm Afterglow','Imagine doing it. What feeling or connection would you hope to carry forward?']]]},
{name:'New Beginnings',x:1100,y:715,flower:'lavender',journeys:[
[['The Old Suitcase','Imagine packing for your next chapter. What belief about yourself would you leave behind?'],['A Letter from Tomorrow','Imagine yourself six months from now after making one change. What would future-you thank you for starting?'],['The First Page','Give your next chapter a title. Describe one small scene you would like in its opening pages.']],
[['The Empty Shelf','What commitment or expectation no longer fits the life you want to build?'],['Making Space','If you set it down, what could that time or energy make room for?'],['The First Keepsake','What new habit or experience would you place on that newly open shelf?']],
[['The Seed Catalog','List three possibilities you have quietly wondered about, even if they seem unrealistic.'],['Choosing One Seed','Which possibility feels most interesting, not necessarily most impressive? Why?'],['The Trial Plot','Design a small experiment to explore it without making a huge commitment.']],
[['A Postcard from the Future','Picture an ordinary morning in a life that fits you better. What do you see first?'],['Tracing the Path','Which part of that morning could you begin creating with the resources you have?'],['Tomorrow’s Detail','Choose one specific action that would make tomorrow resemble that picture a little more.']],
[['The Changing Seasons','What part of your life feels like it is ending, shifting, or beginning?'],['What Comes Along','What lesson or value from the previous season do you want to carry forward?'],['A Gentle Welcome','Write a short welcome note to the person you are becoming, without demanding perfection.']]]}
];
const key='garden-of-becoming-v2';const symbols=['🌹','🤍','🪻','🌼','🌸','🌱'];const unlocks=['The Rose Arch Awakens','The Wishing Arbor Blooms','The Fountain Begins to Flow','The Golden Garden Ignites','The Butterfly Meadow Awakens','The Greenhouse Opens'];
const positions=[[23,58],[45,53],[70,53],[29,76],[52,77],[77,75]];
const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.beds)||state.beds.length!==6)state={beds:Array.from({length:6},()=>Array.from({length:5},()=>({stage:0,answers:[]}))),events:[]};
let chosen=-1,chosenFlower=0;const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){toast('Your browser blocked local saving. Export your reflections before leaving.')}};const count=i=>state.beds[i].filter(f=>f.stage===3).length;const total=()=>state.beds.reduce((a,_,i)=>a+count(i),0);
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',4300)}
function magic(message){$('celebrateText').textContent='✧ '+message+' ✧';$('celebrate').classList.remove('show');void $('celebrate').offsetWidth;$('celebrate').classList.add('show');setTimeout(()=>$('celebrate').classList.remove('show'),4000)}
function render(){const n=total(),level=n/30;$('counter').textContent=n+' / 30 flowers blooming';$('meter').style.width=(level*100)+'%';$('world').classList.toggle('finale',n===30);$('living').style.opacity=String(Math.min(.92,level*.95));$('living').style.maskImage=n===30?'none':positions.map((pos,i)=>`radial-gradient(ellipse ${Math.max(8,15+count(i)*8)}% ${Math.max(10,15+count(i)*8)}% at ${pos[0]}% ${pos[1]}%,black 10%,transparent 100%)`).join(',');$('world').querySelector('.landscape').style.filter=`saturate(${.25+level*.9}) brightness(${.47+level*.58})`;
$('map').innerHTML='';themes.forEach((theme,i)=>{let b=document.createElement('button');b.className='spot'+(chosen===i?' active':'')+(count(i)===5?' complete':'');b.style.left=positions[i][0]+'%';b.style.top=positions[i][1]+'%';b.innerHTML=`<span class="vine"></span><span class="emblem">${symbols[i]}</span><span class="name">${theme.name}</span><span class="small">${count(i)} of 5 in bloom</span>`;b.setAttribute('aria-label',theme.name+', '+count(i)+' of 5 flowers blooming');b.onclick=()=>select(i);$('map').appendChild(b)});
$('plant').disabled=chosen<0;$('fireflies').innerHTML='';for(let i=0;i<Math.min(38,n+state.beds.filter((_,j)=>count(j)===5).length*3);i++){let f=document.createElement('i');f.className='firefly';f.style.left=(10+(i*31%80))+'%';f.style.top=(24+(i*19%60))+'%';f.style.animationDelay=(-i*.61)+'s';$('fireflies').appendChild(f)}
}
function select(i){chosen=i;$('hint').textContent=themes[i].name+' · Tend five flowers, each through three reflections.';render();openBed()}
function closePanel(){$('panel').classList.remove('open')};function panel(eyebrow,title,body,actions){$('eyebrow').textContent=eyebrow;$('panelTitle').textContent=title;$('panelBody').innerHTML='';if(typeof body==='string'){$('panelBody').textContent=body}else $('panelBody').appendChild(body);$('panelActions').innerHTML='';actions.forEach(a=>{let b=document.createElement('button');b.className='action'+(a.secondary?' secondary':'');b.textContent=a.label;b.onclick=a.fn;$('panelActions').appendChild(b)});$('panel').classList.add('open')}
function openBed(){if(chosen<0)return;const i=chosen,wrap=document.createElement('div'),intro=document.createElement('p');intro.textContent='Every flower is a small journey. Plant a seed, nurture its leaves, then help it bloom. You may skip any question.';wrap.appendChild(intro);let grid=document.createElement('div');grid.className='flower-grid';state.beds[i].forEach((f,j)=>{let b=document.createElement('button');b.className='flower';b.innerHTML='<strong>'+(['◇','🌱','🌿','✿'][f.stage])+'</strong><span>Flower '+(j+1)+'<br>'+(['Unplanted','Seedling','Growing','Bloomed'][f.stage])+'</span>';b.onclick=()=>reflect(i,j);grid.appendChild(b)});wrap.appendChild(grid);let note=document.createElement('p');note.className='note';note.textContent=count(i)===5?'✧ '+unlocks[i]+' — this part of your garden has awakened.':'Complete all five flowers to unlock a magical transformation in this part of the garden.';wrap.appendChild(note);panel('A living chapter',themes[i].name,wrap,[{label:'Return to garden',secondary:true,fn:closePanel}])}
function reflect(i,j){chosen=i;chosenFlower=j;const flower=state.beds[i][j];if(flower.stage===3){let p=document.createElement('p');p.textContent='This flower is blooming. Its reflections remain in your journal.';panel('Flower '+(j+1),'A flower in bloom',p,[{label:'Back to garden bed',fn:openBed}]);return}
const step=flower.stage,q=themes[i].journeys[j][step],wrap=document.createElement('div'),p=document.createElement('p');p.textContent=q[1];wrap.appendChild(p);let textarea=document.createElement('textarea');textarea.placeholder='Write what feels meaningful to you…';textarea.setAttribute('aria-label','Your reflection');textarea.value=flower.answers[step]||'';wrap.appendChild(textarea);let caption=document.createElement('p');caption.className='note';caption.textContent='There is no right answer. You can skip this prompt and still let your garden grow.';wrap.appendChild(caption);
const finish=skip=>{const response=skip?'':textarea.value.trim();if(!skip&&!response){toast('Write a reflection or choose Skip for now.');return}flower.answers[step]=response;flower.stage++;state.events.push({date:new Date().toISOString(),bed:themes[i].name,flower:j+1,stage:step+1,title:q[0],prompt:q[1],answer:response,skipped:skip});save();closePanel();render();if(total()===30){magic('The Garden of Becoming');toast('Every part of your sanctuary has come alive.')}else if(flower.stage===3&&count(i)===5){magic(unlocks[i]);toast('A whole part of your garden has awakened! ✨')}else toast(['A tiny seedling emerges from the soil.','New leaves unfurl in the sunlight.','Your flower opens into bloom.'][step]);setTimeout(openBed,950)};
panel(['Plant the seed · 1 of 3','Nurture the leaves · 2 of 3','Let it bloom · 3 of 3'][step],q[0],wrap,[{label:['Plant my seed','Help it grow','Let it bloom'][step],fn:()=>finish(false)},{label:'Skip gently',secondary:true,fn:()=>finish(true)},{label:'Back',secondary:true,fn:openBed}]);setTimeout(()=>textarea.focus(),50)}
$('home').onclick=()=>{chosen=-1;closePanel();$('hint').textContent='Choose a garden bed to begin restoring your sanctuary.';render()};$('plant').onclick=openBed;
$('journal').onclick=()=>{let wrap=document.createElement('div');wrap.style.maxHeight='48vh';wrap.style.overflow='auto';if(!state.events.length)wrap.textContent='Your reflections will appear here as your garden grows.';else state.events.slice().reverse().forEach(e=>{let p=document.createElement('p');p.style.borderBottom='1px solid #b7a77f';p.style.paddingBottom='10px';let strong=document.createElement('strong');strong.textContent=e.bed+' · '+e.title;p.appendChild(strong);p.appendChild(document.createElement('br'));p.appendChild(document.createTextNode(e.answer||'(Prompt skipped)'));wrap.appendChild(p)});panel('Your story so far','Pages from the garden',wrap,[{label:'Close journal',fn:closePanel}])};
$('export').onclick=()=>{let text='THE GARDEN OF BECOMING — MY REFLECTIONS\n\n'+state.events.map(e=>`${e.bed} · Flower ${e.flower} · ${e.title}\n${e.prompt}\n${e.answer||'(Skipped)'}\n`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='my-garden-reflections.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});render();
</script></body></html>
