:root{font-family:Georgia,serif;color:#f9f0d9;background:#101c19}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}.world{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#425a5c 0%,#bd9c79 38%,#e1b98a 49%,#344d37 50%,#192f28 100%)}.world:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 25%,#07161077 100%)}.sky{position:absolute;inset:0 0 44%;background:radial-gradient(circle at 74% 55%,#fff4b7 0%,#edc28c 9%,transparent 37%)}.sun{position:absolute;width:110px;height:110px;border-radius:50%;top:21%;left:72%;background:#fff3b6;filter:blur(13px);opacity:.75}.scene{position:absolute;width:1400px;height:820px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1)) translate(var(--panx,0px),var(--pany,0px));transform-origin:50% 58%;transition:transform 1.4s cubic-bezier(.2,.75,.15,1);filter:drop-shadow(0 14px 12px #07160c55)}.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.bed{position:absolute;width:205px;height:110px;border-radius:50%;background:radial-gradient(ellipse,#503321 0%,#38231c 55%,#94785d 59%,#5a5d44 66%,transparent 69%);box-shadow:0 12px 20px #0b1e15b0;transform:translate(-50%,-50%);border:0;transition:filter .4s}.bed:hover,.bed:focus-visible{filter:brightness(1.3);outline:2px solid #f4d7a1}.bed.selected{outline:3px solid #ffdd9c}.bed .name{position:absolute;top:104%;left:50%;transform:translateX(-50%);white-space:nowrap;color:#ffe8b7;text-shadow:0 2px 5px #15251e;font-size:16px;letter-spacing:.04em}.bed .plants{position:absolute;inset:0;pointer-events:none}.plant{position:absolute;bottom:45%;left:var(--x);width:70px;height:110px;transform:translateX(-50%) scale(var(--size,1));transform-origin:50% 100%;animation:emerge .9s ease both}.plant svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px #1b281a)}@keyframes emerge{from{opacity:0;t .bed{width:210px;height:105px;background:transparent;box-shadow:none;border:0;border-radius:40%;outline-offset:4px}
.bed:hover,.bed:focus-visible{background:#f9df9a24;outline:2px solid #f5dfa6;filter:brightness(1.08)}
.bed.selected{outline:2px solid #ffdda6;background:#f9df9a13}
.bed.finished{box-shadow:0 0 36px #ffdf8880}
.bed .name{display:none}
.bed .plants{overflow:visible;z-index:3}
.plant{bottom:30%;width:78px;height:115px;filter:drop-shadow(0 3px 6px #18291488)}
.world{background:radial-gradient(ellipse at 50% 30%,#bca47b,#172f25 80%)}
.world .sky,.world .sun{display:none}
.hud{background:#1d352cde;border:1px solid #e3c88b;box-shadow:0 8px 35px #07140c99}
.brand{top:14px;left:14px;max-width:315px;padding:11px 16px}
.brand h1{font-size:22px}.progress{top:14px;right:14px}
.toolbar{background:#20392de8;bottom:14px;flex-wrap:wrap;justify-content:center;min-width:min(780px,95vw)}
.hint{bottom:90px;background:#1d352cdd}
.dialog{background:linear-gradient(150deg,#f6e9ce,#d7bc8c);border:9px double #9e7b49;max-height:92dvh;overflow:auto}
.dialog h2{font-style:italic}.dialog textarea:focus{outline:3px solid #b19d72}
@media(max-width:700px){.brand{max-width:200px}.brand h1{font-size:17px}.progress{top:90px;right:7px}.toolbar{min-width:0;flex-wrap:nowrap;justify-content:flex-start}.hint{bottom:92px}}
@media(prefers-reduced-motion:reduce){.scene,.plant,.plant .head,.butterfly{animation:none!important;transition:none!important}}
</style><style>
/* Botanical immersion refinements */
.scene{transition:transform 1.8s cubic-bezier(.16,.83,.2,1)!important}
.bed .plants{pointer-events:none;overflow:visible}
.plant{width:104px!important;height:155px!important;bottom:34%!important;z-index:6;filter:drop-shadow(2px 10px 5px #241c1677)!important;animation:seed-rise 1.45s cubic-bezier(.2,.7,.2,1) both!important}
.plant svg.botanical{position:relative;width:100%;height:100%;overflow:visible}
.botanical-sway{transform-origin:72px 193px;animation:botanical-sway 5s ease-in-out infinite alternate}
.flower-unfold{transform-origin:72px 58px;animation:flower-open 2.3s cubic-bezier(.2,.85,.22,1) both}
.bud-open{transform-origin:72px 66px;animation:flower-open 1.8s ease both}
.leaf-open{transform-origin:72px 160px;animation:leaf-open 1.3s ease both}
@keyframes botanical-sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes flower-open{from{opacity:.2;transform:scale(.18) rotate(-16deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes leaf-open{from{opacity:.2;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes seed-rise{from{opacity:0;transform:translateX(-50%) translateY(55px) scale(.16)}to{opacity:1;transform:translateX(-50%) scale(var(--size,1))}}
.world:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 78% 18%,#fff3bd28,transparent 45%);animation:daylight 13s ease-in-out infinite alternate}
@keyframes daylight{to{opacity:.48}}
.world .garden-glow{z-index:2}
.bed.finished:after{content:'✧ ✦';font-size:22px;position:absolute;right:10px;top:-30px;color:#fff3c1;filter:drop-shadow(0 0 9px #ffe2a2);animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.35;transform:translateY(-8px)}}
.butterfly{filter:drop-shadow(0 0 5px #f9d78d);z-index:8}
@media(prefers-reduced-motion:reduce){.scene,.plant,.botanical-sway,.flower-unfold,.bud-open,.leaf-open,.world:before,.bed.finished:after{animation:none!important;transition:none!important}}
</style></head><body><main class="world"><div class="sky"></div><div class="garden-glow"></div><div class="sun"></div><div class="scene" id="scene"><div id="beds"></div><div id="butterflies"></div></div><section class="hud brand"><h1>✿ My Life as a Garden</h1><p>An enchanted sanctuary shaped by your reflections</p></section><section class="hud progress"><strong id="progressLabel">0 of 30 flowers blooming</strong><div class="track"><div class="fill" id="fill"></div></div></section><div class="hud hint" id="hint">Choose a garden bed to move closer. Every flower begins with a reflection.</div><nav class="hud toolbar"><button class="btn" id="back">⌂ Full garden</button><button class="btn" id="plant">✿ Plant a seed</button><button class="btn" id="nurture">☂ Nurture a flower</button><button class="btn" id="journal">✎ My journal</button><button class="btn" id="reset">↺ Start anew</button></nav><div class="toast" id="toast"></div><div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="chapter" id="chapter"></div><h2 id="dialogTitle"></h2><div class="stagepill" id="stagepill"></div><p id="dialogPrompt"></p><div class="flower-choice" id="choices"></div><textarea id="reflection" placeholder="Write whatever feels meaningful to you..."></textarea><footer><button class="btn" id="skip">Skip this reflection</button><button class="btn" id="cancel">Cancel</button><button class="btn" id="submit">Continue</button></footer></section></div></main><script>

[['The Quiet Achievement','Name something you accomplished that nobody applauded. What did it take from you?'],['Your Own Witness','If you could give that effort a small ceremony, what would you say to honor it?'],['A Place on the Mantel','What does this accomplishment prove about you, even if nobody else ever notices it?']],
[['The Borrowed Label','What label have others given you that never quite fit? Where did it come from?'],['Peeling It Away','Describe a moment when your actions contradicted that label.'],['Your True Name','Choose three words that describe who you are beyond that label. What evidence supports each one?']],
[['The Inner Critic’s Script','Write one exact sentence your inner critic repeats when you struggle.'],['The Gentle Editor','Which words in that sentence are unfair or exaggerated? Rewrite it with accuracy and kindness.'],['A New Refrain','What shorter, believable sentence could you practice saying instead next time?']],
[['The Unseen Strength','Think of a hard season you survived. What strength helped you through that you rarely acknowledge?'],['Giving It Room','Where could you use that same strength in one small way this week?'],['The Rose You Keep','What would you like to remember about yourself when the next difficult season comes?']]]},

[['The Energy Weather','Think of a recent interaction that left you feeling lighter or heavier. What happened?'],['Reading the Forecast','What clues in your body or mood tell you a relationship feels nourishing or draining?'],['Choosing Shelter','What is one change you could make to care for yourself before or after a draining interaction?']],

[['The Connection You Miss','Remember a moment you felt genuinely understood. What did the other person do?'],['Recreating the Moment','Which small part of that experience could you invite into a current relationship?'],['A Living Invitation','Write a simple invitation or request for connection you could make, if you choose.']]]},

[['The Unfinished Loop','What small unfinished task keeps tugging at your attention?'],['A Two-Minute Beginning','What is the smallest visible first step, even if you cannot finish the whole task?'],['Permission to Rest','What could you tell yourself after taking that step so you can stop carrying it for tonight?']],

[['The Sensory Map','Recall a place where you have felt calm. What sound, texture, scent, or light do you remember?'],['One Small Anchor','Choose one sensory detail you can recreate safely in your current space. How?'],['The Return Path','Write a simple three-step grounding ritual you could use on a difficult day.']]]},

[['The Changing Seasons','What part of your life feels like it is ending, shifting, or beginning?'],['What Comes Along','What lesson or value from the previous season do you want to carry forward?'],['A Gentle Welcome','Write a short welcome note to the person you are becoming, without demanding perfection.']]]}

const key='garden-storybook-90-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!data||!Array.isArray(data.beds)||data.beds.length!==6)data={beds:themes.map(()=>[]),journal:[]};let selected=-1,mode='',target=-1;const scene=document.getElementById('scene'),bedsEl=document.getElementById('beds'),overlay=document.getElementById('overlay');const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(key,JSON.stringify(data));const flowerNames=['rose','daisy','lavender','sunflower'];const colors={rose:['#c87786','#f4c4bd'],daisy:['#f7edc6','#fffdf0'],lavender:['#9576c7','#c9aee8'],sunflower:['#dba73b','#f4d46b']};
function plantSVG(p){
 const stage=p.stage, kind=p.kind, palette={rose:['#e8a6a8','#b83f69','#fff0dd'],lavender:['#bca3ed','#7754b5','#e9d9fc'],daisy:['#fffdf3','#f4e5bb','#e5a948'],sunflower:['#f8ce59','#dc8b2f','#6e4929']}[kind]||['#efb0b8','#bd5475','#fff0dc'];
 const id='f'+Math.random().toString(36).slice(2,9);
 const leaves=stage>=2?`<g class="leaf-open"><path d="M71 162 C43 144 29 114 19 122 C19 151 43 169 71 163Z" fill="url(#leaf${id})"/><path d="M71 145 C100 111 124 117 129 129 C117 150 93 159 71 150Z" fill="url(#leaf${id})"/><path d="M72 164 L30 134 M72 147 L118 129" stroke="#c2d6a1" stroke-width="1.5" fill="none" opacity=".65"/></g>`:'';
 const petals=kind==='lavender'?Array.from({length:15},(_,i)=>`<ellipse cx="${61+(i%3)*9}" cy="${48+Math.floor(i/3)*10}" rx="7" ry="11" fill="${palette[i%2]}" opacity=".95"/>`).join(''):kind==='rose'?Array.from({length:15},(_,i)=>{let a=i*137.5*Math.PI/180,r=5+Math.sqrt(i)*6;return `<ellipse cx="${72+Math.cos(a)*r}" cy="${49+Math.sin(a)*r*.66}" rx="${14-i*.22}" ry="${10-i*.12}" transform="rotate(${i*57} ${72+Math.cos(a)*r} ${49+Math.sin(a)*r*.66})" fill="${palette[i%3]}" stroke="#713a48" stroke-width=".6"/>`}).join(''):Array.from({length:kind==='sunflower'?18:12},(_,i)=>`<ellipse cx="72" cy="${kind==='sunflower'?21:26}" rx="${kind==='sunflower'?9:8}" ry="${kind==='sunflower'?23:20}" transform="rotate(${i*(kind==='sunflower'?20:30)} 72 53)" fill="${palette[i%2]}" stroke="#aa875e" stroke-width=".6"/>`).join('');
 const bloom=stage===3?`<g class="flower-unfold">${petals}<circle cx="72" cy="53" r="${kind==='rose'?7:kind==='lavender'?0:kind==='sunflower'?18:12}" fill="${kind==='sunflower'?'#634129':'#dfb95d'}"/>${kind==='sunflower'?Array.from({length:20},(_,i)=>`<circle cx="${72+Math.cos(i*2.4)*Math.sqrt(i)*3}" cy="${53+Math.sin(i*2.4)*Math.sqrt(i)*3}" r="1.6" fill="#e3a84e"/>`).join(''):''}</g>`:stage===2?`<g class="bud-open"><path d="M59 65 Q48 42 70 34 Q94 45 83 65 Q72 74 59 65" fill="${palette[1]}" stroke="#526e42" stroke-width="2"/><path d="M58 66 Q71 81 85 65" fill="none" stroke="#70964d" stroke-width="6"/></g>`:'';
 return `<svg class="botanical" viewBox="0 0 145 205" aria-hidden="true"><defs><linearGradient id="stem${id}" x2="1" y2=".2"><stop stop-color="#294b30"/><stop offset=".55" stop-color="#78a65c"/><stop offset="1" stop-color="#3c653a"/></linearGradient><linearGradient id="leaf${id}" x2="1" y2="1"><stop stop-color="#a4c56c"/><stop offset=".55" stop-color="#477a40"/><stop offset="1" stop-color="#244d35"/></linearGradient></defs><ellipse cx="72" cy="196" rx="29" ry="6" fill="#241c13" opacity=".4"/><g class="botanical-sway"><path d="M72 192 Q${stage===1?70:61} ${stage===1?175:113} 72 ${stage===1?158:53}" fill="none" stroke="url(#stem${id})" stroke-width="${stage===1?5:7}" stroke-linecap="round"/>${stage===1?`<path d="M71 167 Q47 143 37 156 Q42 172 71 172 M73 168 Q98 140 106 156 Q97 175 73 173" fill="url(#leaf${id})"/>`:leaves}${bloom}</g></svg>`
}
function render(){bedsEl.innerHTML='';let blooms=0;themes.forEach((d,i)=>{const b=document.createElement('button');let complete=data.beds[i].filter(p=>p.stage===3).length===5;b.className='bed'+(selected===i?' selected':'')+(complete?' finished':'');b.style.left=d.x+'px';b.style.top=d.y+'px';b.setAttribute('aria-label','Zoom into '+d.name);b.innerHTML=`<div class="plants"></div><span class="name">${d.name} · ${data.beds[i].filter(p=>p.stage===3).length}/5</span>`;b.onclick=()=>zoom(i);const box=b.querySelector('.plants');data.beds[i].forEach((p,j)=>{if(p.stage===3)blooms++;let el=document.createElement('div');el.className='plant';el.style.setProperty('--x',(12+j*19)+'%');el.style.setProperty('--size',String(.54+j%2*.12));el.innerHTML=plantSVG(p);box.appendChild(el)});bedsEl.appendChild(b)});$('progressLabel').textContent=`${blooms} of 30 flowers blooming`;$('fill').style.width=(blooms/30*100)+'%';$('butterflies').innerHTML=blooms>=2?Array.from({length:Math.min(12,Math.floor(blooms/2))},(_,i)=>`<span class="butterfly" style="left:${200+i*90}px;top:${330+(i%3)*65}px;animation-delay:${-i}s">🦋</span>`).join(''):'';document.querySelector('.world').classList.toggle('flourish',blooms>=15);$('plant').disabled=selected<0||data.beds[selected]?.length>=5;$('nurture').disabled=selected<0||!data.beds[selected]?.some(p=>p.stage<3);if(blooms===30&&!data.celebrated){data.celebrated=true;save();showToast('Your entire sanctuary is blooming. Every reflection has helped it grow. ✨')}}
function zoom(i){selected=i;const d=themes[i];scene.style.setProperty('--scale','2.05');scene.style.setProperty('--panx',(700-d.x)+'px');scene.style.setProperty('--pany',(500-d.y)+'px');$('hint').textContent=`${d.name} · Five unique flowers, each with three reflections. Tap Plant or Nurture.`;render()}
function home(){selected=-1;scene.style.setProperty('--scale','1');scene.style.setProperty('--panx','0px');scene.style.setProperty('--pany','0px');$('hint').textContent='Choose a garden bed to glide closer. Plant, nurture, and bloom five flowers in each sanctuary.';render()}
function dialog(title,prompt,action,step){mode=action;$('chapter').textContent=selected<0?'Your botanical journal':themes[selected].name+' · Flower '+(target+1)+' of 5';$('dialogTitle').textContent=title;$('dialogPrompt').textContent=prompt;$('stagepill').textContent=step||'';$('stagepill').style.display=step?'inline-block':'none';$('reflection').value='';$('choices').innerHTML='';$('reflection').style.display=action==='journal'?'none':'block';$('skip').style.display=action==='journal'?'none':'inline-block';$('submit').textContent=action==='journal'?'Close':action==='plant'?'Plant my seed':action==='grow'?'Water and grow':'Let it bloom';overlay.classList.add('open');if(action!=='journal')$('reflection').focus()}
function showToast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.display='none',4200)}
$('back').onclick=home;$('plant').onclick=()=>{if(selected<0||data.beds[selected].length>=5)return;target=data.beds[selected].length;const q=themes[selected].journeys[target][0];dialog(q[0],q[1],'plant','01 / PLANT THE SEED')};$('nurture').onclick=()=>{if(selected<0)return;target=data.beds[selected].findIndex(p=>p.stage<3);if(target<0)return;let stage=data.beds[selected][target].stage,q=themes[selected].journeys[target][stage];dialog(q[0],q[1],stage===1?'grow':'bloom',stage===1?'02 / NURTURE GROWTH':'03 / LET IT BLOOM')};$('journal').onclick=()=>{const content=data.journal.length?data.journal.slice().reverse().map(x=>`${x.date} · ${x.bed} · ${x.title}\n${x.text||'(Reflection skipped)'}`).join('\n\n✦ ✦ ✦\n\n'):'Your reflections will appear here as you cultivate your garden.';dialog('Pages from your garden',content,'journal');$('dialogPrompt').className='journal-text'};$('cancel').onclick=()=>overlay.classList.remove('open');
function finish(skipped){const val=$('reflection').value.trim();if(!skipped&&!val){showToast('Write a reflection, or choose Skip to continue gently.');return}if(mode==='journal'){overlay.classList.remove('open');return}let title=$('dialogTitle').textContent;if(mode==='plant'){data.beds[selected].push({kind:themes[selected].flower,stage:1});showToast('Your seed is planted. A little sprout appears. 🌱')}else{data.beds[selected][target].stage++;showToast(mode==='bloom'?'Your flower opens into bloom! ✿':'Your seedling stretches and forms a bud. 🌿')}data.journal.push({date:new Date().toLocaleDateString(),bed:themes[selected].name,title,text:val,skipped});save();overlay.classList.remove('open');render()}
$('submit').onclick=()=>finish(false);$('skip').onclick=()=>finish(true);const exportButton=document.createElement('button');exportButton.className='btn';exportButton.textContent='↓ Save journal';document.querySelector('.toolbar').appendChild(exportButton);exportButton.onclick=()=>{const lines=data.journal.map(j=>[j.date,j.bed,j.title,j.skipped?'(skipped)':j.text].join('\n')).join('\n\n---\n\n');const blob=new Blob(['My Life as a Garden — Reflection Journal\n\n'+(lines||'No reflections yet.')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-garden-journal.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{if(confirm('Begin a new garden? This clears your saved flowers and private reflections on this browser.')){data={beds:themes.map(()=>[]),journal:[]};save();home()}};window.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});render();
</script></body></html>
